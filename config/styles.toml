# Style presets — genre and texture fixed upfront; LLM/drafter fills the rest.
# chords   : chord names cycled one-per-bar
# sections : form; sum(bars) is the song length
# vocal_range / lyric_line_range : validator limits
# accompaniment : "block" (whole-bar chord) or "arp" (8th-note arpeggio)
# density  : probability an 8th-note slot gets a melody note

[ballad]
label = "ピアノバラード"
bpm = 72
key = "C major"
beats_per_bar = 4
vocal_range = [55, 79]
chords = ["C", "G", "Am", "F"]
sections = [
  { name = "intro", bars = 2 },
  { name = "A", bars = 4 },
  { name = "B", bars = 4 },
  { name = "sabi", bars = 8 },
  { name = "outro", bars = 2 },
]
accompaniment = "block"
density = 0.55
lyric_line_range = [4, 14]
mood_keywords = ["疲れ", "悲", "切な", "静か", "夜", "涙", "寂し"]

