[project]
name = "music-transcription"
version = "0.1.0"
description = "Music transcription from WAV to sheet music"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "mir_eval>=0.7.0",
    "pretty_midi>=0.2.10",
    "music21>=9.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
